name: instauto
description: InstaAuto — Instagram Comment and DM Automation App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0
  http: ^1.2.2

  # In-app update: SHA-256 verification of downloaded APKs
  crypto: ^3.0.6

  # State management
  provider: ^6.1.2

  # Auth / storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Navigation
  go_router: ^14.6.2

  # Instagram OAuth — open external browser
  url_launcher: ^6.3.1
  app_links: ^6.3.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  intl: any
  device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
