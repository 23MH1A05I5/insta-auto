services:
  - type: web
    name: instaauto-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      - key: VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        value: https://insta-auto-my00.onrender.com/auth/instagram/callback
      - key: APP_BASE_URL
        value: https://insta-auto-my00.onrender.com
      - key: FRONTEND_DEEP_LINK
        value: instauto://oauth-callback
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DRY_RUN
        value: "false"
      - key: ENABLE_PUBLIC_REPLY
        value: "true"
      - key: ENABLE_PRIVATE_REPLY
        value: "true"
      # ── In-app APK update metadata (set real values in the Render dashboard) ──
      - key: APP_VERSION
        sync: false
      - key: APP_VERSION_CODE
        sync: false
      - key: APK_PUBLIC_URL
        sync: false
      - key: APK_SHA256
        sync: false
      - key: APK_ALLOWED_HOST
        sync: false
      - key: APK_SIZE_BYTES
        sync: false
      - key: APP_UPDATE_MANDATORY
        value: "false"
      - key: APP_RELEASE_NOTES
        sync: false
